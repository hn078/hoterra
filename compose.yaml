services:
  postgres:
    image: postgres:17-alpine
    container_name: hoterra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hoterra
      POSTGRES_USER: hoterra
      POSTGRES_PASSWORD: hoterra_dev_password
    ports:
      - "5432:5432"
    volumes:
      - hoterra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoterra -d hoterra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hoterra_postgres_data:
