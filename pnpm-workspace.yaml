packages:
  - '.'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  electron: true
  electron-winstaller: true
  esbuild: true
  prisma: true

# Keep the pnpm dependency graph aligned with the npm override in package.json.
# Prisma 6 currently declares deepmerge-ts 7.x, which is affected by
# GHSA-ggr8-5vv4-36mx; 8.x is API-compatible for Prisma's config usage.
overrides:
  deepmerge-ts: ^8.0.0
